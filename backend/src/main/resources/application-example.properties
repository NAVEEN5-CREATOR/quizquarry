# Spring Application Configuration Template
spring.application.name=quizquarry-backend
server.port=8080

# MySQL Database Configuration Example
# Replace values with your actual database host and credentials
spring.datasource.url=jdbc:mysql://localhost:3306/quizquarry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Settings
app.jwt.secret=REPLACE_WITH_SECURE_256_BIT_SECRET_STRING_HERE
app.jwt.expiration-ms=86400000

# Google Gemini API Settings
gemini.api.key=YOUR_GEMINI_API_KEY

# Swagger & OpenAPI Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
