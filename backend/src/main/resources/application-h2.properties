# Zero-setup standalone H2 profile
spring.application.name=quizquarry-backend-standalone

spring.datasource.url=jdbc:h2:file:./data/quizquarrydb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Security Settings
app.jwt.secret=${JWT_SECRET:quizquarry_super_secret_jwt_key_that_is_at_least_256_bits_long_and_secure_2026}
app.jwt.expiration-ms=86400000

# Google Gemini API Settings
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-pro-latest}

# Swagger & OpenAPI Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
