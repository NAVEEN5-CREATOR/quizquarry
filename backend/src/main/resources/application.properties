# Spring Application Configuration
spring.application.name=quizquarry-backend
server.port=${PORT:8080}

# MySQL Database Configuration (Driven by Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizquarry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Settings
app.jwt.secret=${JWT_SECRET:quizquarry_super_secret_jwt_key_that_is_at_least_256_bits_long_and_secure_2026}
app.jwt.expiration-ms=86400000

# Google Gemini API Settings
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-pro-latest}

# Swagger & OpenAPI Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
