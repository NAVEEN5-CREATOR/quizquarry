# In-memory H2 configuration for backend testing
spring.application.name=quizquarry-backend-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test_secret_key_for_unit_tests_that_is_long_enough_256_bits_2026
app.jwt.expiration-ms=3600000

gemini.api.key=test_gemini_api_key
